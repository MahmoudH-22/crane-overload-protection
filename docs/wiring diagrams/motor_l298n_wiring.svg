<text x="1360.0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">GA25-370 12 V</text>
<text x="1360.0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#dfe6ea" text-anchor="middle">gear motor + Hall encoder</text>
