<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980">
<rect width="1500" height="980" fill="#f7f7f5"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#222" text-anchor="start">Ultrasonic HC-SR04 (under the basket, pointing down) → Arduino Uno</text>
<text x="40" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#555" text-anchor="start">Measures the distance from the basket bottom to whatever is below it (table or an object).</text>
<rect x="60" y="130" width="320" height="420" rx="16" fill="#1f6fa8"/>
<text x="220.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">Arduino</text>
<text x="220.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#dfe6ea" text-anchor="middle">UNO R3</text>
<rect x="368" y="188" width="24" height="24" fill="#222"/>
<text x="358" y="207" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="end">5V</text>
<rect x="368" y="268" width="24" height="24" fill="#222"/>
<text x="358" y="287" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="end">D4</text>
<rect x="368" y="348" width="24" height="24" fill="#222"/>
<text x="358" y="367" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="end">D11</text>
<rect x="368" y="428" width="24" height="24" fill="#222"/>
<text x="358" y="447" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="end">GND</text>
<rect x="820" y="100" width="300" height="380" rx="16" fill="#1565c0"/>
<text x="970.0" y="140" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">HC-SR04</text>
<text x="970.0" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#dfe6ea" text-anchor="middle">ultrasonic sensor</text>
<rect x="808" y="188" width="24" height="24" fill="#222"/>
<text x="842" y="207" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="start">VCC</text>
<rect x="808" y="268" width="24" height="24" fill="#222"/>
<text x="842" y="287" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="start">Trig</text>
<rect x="808" y="348" width="24" height="24" fill="#222"/>
<text x="842" y="367" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="start">Echo</text>
<rect x="808" y="428" width="24" height="24" fill="#222"/>
<text x="842" y="447" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="start">GND</text>
<rect x="470" y="170" width="260" height="300" rx="14" fill="#e0e0e0" opacity="0.6"/>
<text x="600" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#555" text-anchor="middle">4-core flexible cable, ≈ 0.7 m</text>
<text x="600" y="522" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#555" text-anchor="middle">runs along the rope (see right)</text>
<polyline points="380,200 820,200" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start" paint-order="stroke" stroke="#f7f7f5" stroke-width="6">5V → VCC</text>
<polyline points="380,280 820,280" fill="none" stroke="#f57c00" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="268" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start" paint-order="stroke" stroke="#f7f7f5" stroke-width="6">D4 → Trig (10 µs pulse)</text>
<polyline points="380,360 820,360" fill="none" stroke="#2e9d48" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="348" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start" paint-order="stroke" stroke="#f7f7f5" stroke-width="6">Echo → D11 (pulse length = time)</text>
<polyline points="380,440 820,440" fill="none" stroke="#111111" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="428" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start" paint-order="stroke" stroke="#f7f7f5" stroke-width="6">GND → GND</text>
<text x="1300" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Side view of the hook</text>
<rect x="1190" y="160" width="230" height="22" fill="#a1887f"/>
<text x="1300" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="white" text-anchor="middle">arm + pulley</text>
<polyline points="1300,182 1300,300" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1310,182 1310,300" fill="none" stroke="#777777" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1320" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#555" text-anchor="start">rope + cable</text>
<text x="1320" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#555" text-anchor="start">(tied every 10 cm)</text>
<rect x="1260" y="300" width="80" height="10" fill="#90a4ae"/>
<text x="1206" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="end">top plate</text>
<rect x="1250" y="318" width="100" height="22" fill="#b0bec5" stroke="#455a64"/>
<text x="1206" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#333" text-anchor="end">load cell</text>
<rect x="1260" y="348" width="80" height="10" fill="#90a4ae"/>
<polyline points="1300,358 1300,380" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1255" y="380" width="90" height="70" fill="#ffcc80" stroke="#ef6c00"/>
<text x="1300" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">basket</text>
<rect x="1270" y="452" width="60" height="18" rx="4" fill="#1565c0"/>
<text x="1206" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1565c0" text-anchor="end">HC-SR04</text>
<polyline points="1310,310 1360,310 1360,460 1330,460" fill="none" stroke="#777777" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1366" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">cable clipped to the</text>
<text x="1366" y="395" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start">top plate, then down</text>
<polyline points="1290,474 1270,640" fill="none" stroke="#90caf9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1300,474 1300,640" fill="none" stroke="#90caf9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1310,474 1330,640" fill="none" stroke="#90caf9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1190" y="640" width="230" height="16" fill="#8d6e63"/>
<text x="1300" y="680" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">table</text>
<text x="1410" y="560" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="start">us</text>
<rect x="30" y="740" width="1440" height="230" rx="10" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
<text x="52" y="774" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#222" text-anchor="start">Notes</text>
<text x="52" y="806" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• VCC 5V, GND, Trig → D4, Echo → D11. Both are 5 V signals, so no divider is needed.</text>
<text x="52" y="836" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• Distance = echo pulse time × 343 m/s ÷ 2. 346 mm of travel = about 2 ms round trip; use a 6 ms timeout so the 50 ms loop stays fast.</text>
<text x="52" y="866" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• Obstacle rule (Uno): object if us &lt; h − 30 mm (or no echo) while h ≥ 50 mm → LOWER refused.</text>
<text x="52" y="896" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• The sensor hangs under the load cell, so its weight is in the reading: tare with it fitted.</text>
<text x="52" y="926" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• Tie the cable to the rope and clip it to the top plate (above the load cell), so the hanging cable's weight does not change the reading as the hook moves.</text>
<text x="52" y="956" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• Keep the wires twisted / in one sheath, away from the motor wires.</text>
</svg>
