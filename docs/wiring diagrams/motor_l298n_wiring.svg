<line x1="1040" y1="620" x2="1040" y2="598" stroke="#d32f2f" stroke-width="4"/>
<polygon points="1030,600 1050,600 1040,584" fill="#d32f2f"/>
<text x="1040" y="576" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#d32f2f" text-anchor="middle">5V</text>
<circle cx="1110" cy="780" r="8" fill="#222"/>
<polyline points="1110,780 1110,800" fill="none" stroke="#777777" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1096.0" y="800.0" width="28" height="60" rx="10" fill="#ead7a6" stroke="#8a6d3b" stroke-width="3"/>
<text x="1134" y="836" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#5d4037" text-anchor="start">4.7 kΩ</text>
<line x1="1110" y1="860" x2="1110" y2="882" stroke="#d32f2f" stroke-width="4"/>
<polygon points="1100,880 1120,880 1110,896" fill="#d32f2f"/>
<text x="1110" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#d32f2f" text-anchor="middle">5V</text>
<text x="1060" y="950" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#666" text-anchor="middle">4.7 kΩ pull-ups to 5V (needed if the encoder board has none)</text>
<rect x="30" y="1150" width="1580" height="230" rx="10" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
<text x="52" y="1184" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#222" text-anchor="start">Notes</text>
<text x="52" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• L298N: D5 → ENA (PWM speed), D7 → IN1, D10 → IN2. IN1 HIGH + IN2 LOW = LIFT, IN1 LOW + IN2 HIGH = LOWER, both LOW = brake.</text>
<text x="52" y="1246" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• Top limit switch (COM–NC) in the IN1 wire + 10 kΩ pull-down: at the top it opens, IN1 falls LOW and the motor cannot lift any more, even if the code is wrong.</text>
<text x="52" y="1276" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• 12 V supply → power switch → E-stop (NC) → L298N +12V: pressing the E-stop cuts motor power in hardware.</text>
<text x="52" y="1306" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• Common ground: L298N GND, 12 V supply −, Uno GND and the encoder black wire all connected.</text>
<text x="52" y="1336" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• GA25-370 encoder (on the motor shaft, 11 pulses per motor turn): blue 5V, black GND, yellow C1 → D2, green C2 → D3. Pulses per drum turn = 11 × gear ratio.</text>
<text x="52" y="1366" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start">• D8 / D9 are kept for the HC-05 on AltSoftSerial: the fast encoder pulses would be lost with SoftwareSerial.</text>
</svg>
