publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'   # Flutter 3.22 or newer

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  mqtt_client: ^10.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
