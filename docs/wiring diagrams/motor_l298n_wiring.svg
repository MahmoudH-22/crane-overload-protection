<polyline points="940,300 1210,300" fill="none" stroke="#d32f2f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="980" y="288" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#333" text-anchor="start" paint-order="stroke" stroke="#f7f7f5" stroke-width="6">OUT1 → M+</text>
<text x="1360" y="910" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#666" text-anchor="middle">Lifts the wrong way? swap M+ and M−</text>
<rect x="1198" y="688" width="24" height="24" fill="#222"/>
<text x="1232" y="707" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="start">C1 / A (yellow)</text>
<rect x="1198" y="768" width="24" height="24" fill="#222"/>
<text x="1232" y="787" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="start">C2 / B (green)</text>
