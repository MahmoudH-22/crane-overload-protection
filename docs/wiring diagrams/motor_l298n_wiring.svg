<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1400" width="1640" height="1400">
<rect width="1640" height="1400" fill="#f7f7f5"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#222" text-anchor="start">Motor GA25-370 12 V with Hall encoder + L298N → Arduino Uno</text>
<text x="40" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#555" text-anchor="start">Arrows marked 5V go to the Uno 5V pin; every ground symbol joins the Uno GND and the 12 V supply −. Motor power never comes from the Uno.</text>
